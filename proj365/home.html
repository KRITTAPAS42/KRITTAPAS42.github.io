<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proj365</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .container { text-align: center; }

  /* Code display */
  .code-display {
    font-size: 2rem;
    font-weight: 300;
    letter-spacing: 0.3em;
    color: #000;
    margin-bottom: 20px;
    min-height: 2.4rem;
  }

  .code-char { color: #ccc; }
  .code-char.filled { color: #000; }

  /* Dots */
  .dots {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 32px;
  }

  .dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid #000;
    background: transparent;
    transition: background 0.15s;
  }

  .dot.filled { background: #000; }

  /* Keypad */
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 72px);
    gap: 12px;
    justify-content: center;
  }

  .key {
    width: 72px;
    height: 72px;
    font-size: 1.3rem;
    font-weight: 400;
    font-family: inherit;
    border-radius: 50%;
    border: 1.5px solid #ddd;
    background: #fff;
    color: #000;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, transform 0.1s;
  }

  .key:hover { background: #f5f5f5; border-color: #bbb; }
  .key:active { transform: scale(0.9); background: #eee; }

  .key-action { color: #888; font-size: 1rem; }

  /* Animations */
  .shake { animation: shake 0.4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-10px); }
    40%     { transform: translateX(10px); }
    60%     { transform: translateX(-8px); }
    80%     { transform: translateX(8px); }
  }

  .flash { animation: flash 0.4s; }
  @keyframes flash {
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>

<div class="container" id="container">

  <div class="code-display">
    <span class="code-char" id="c0">–</span>
    <span class="code-char" id="c1">–</span>
    <span class="code-char" id="c2">–</span>
    <span class="code-char" id="c3">–</span>
  </div>

  <div class="dots">
    <div class="dot" id="d0"></div>
    <div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div>
    <div class="dot" id="d3"></div>
  </div>

  <div class="keypad">
    <button class="key" onclick="press(1)">1</button>
    <button class="key" onclick="press(2)">2</button>
    <button class="key" onclick="press(3)">3</button>
    <button class="key" onclick="press(4)">4</button>
    <button class="key" onclick="press(5)">5</button>
    <button class="key" onclick="press(6)">6</button>
    <button class="key" onclick="press(7)">7</button>
    <button class="key" onclick="press(8)">8</button>
    <button class="key" onclick="press(9)">9</button>
    <button class="key key-action" onclick="deleteOne()">⌫</button>
    <button class="key" onclick="press(0)">0</button>
    <button class="key key-action" onclick="clearCode()">C</button>
  </div>

</div>

<script>
  let code = '';
  const correctCode = '1506';
  const container = document.getElementById('container');

  function updateDisplay() {
    for (let i = 0; i < 4; i++) {
      const c = document.getElementById('c' + i);
      const d = document.getElementById('d' + i);
      if (i < code.length) {
        c.textContent = code[i];
        c.classList.add('filled');
        d.classList.add('filled');
      } else {
        c.textContent = '–';
        c.classList.remove('filled');
        d.classList.remove('filled');
      }
    }
  }

  function press(num) {
    if (code.length < 4) {
      code += num;
      updateDisplay();
    }
    if (code.length === 4) checkCode();
  }

  function deleteOne() {
    code = code.slice(0, -1);
    updateDisplay();
  }

  function clearCode() {
    code = '';
    updateDisplay();
  }

  function checkCode() {
    if (code === correctCode) {
      container.classList.add('flash');
      setTimeout(() => { window.location.href = '365home.html'; }, 400);
    } else {
      container.classList.add('shake');
      setTimeout(() => {
        container.classList.remove('shake');
        clearCode();
      }, 400);
    }
  }
</script>

</body>
</html>
